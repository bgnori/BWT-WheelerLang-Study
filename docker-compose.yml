version: "3.8"

services:
  bwtsearch:
    build: .
    volumes:
      # Mount local ./data into the container so index files persist.
      - ./data:/data
    working_dir: /data
    # Override the default entrypoint arguments when running interactively:
    #   docker compose run bwtsearch search moby.idx "whale"
    stdin_open: true
    tty: true

  # Convenience service that downloads the Moby Dick test corpus.
  download:
    image: alpine:3.19
    command: >
      sh -c "apk --no-cache add wget &&
             mkdir -p /data &&
             wget -q -O /data/moby_dick.txt
               https://www.gutenberg.org/cache/epub/2701/pg2701.txt &&
             echo 'Downloaded moby_dick.txt'"
    volumes:
      - ./data:/data

  # Convenience service that downloads and converts the Aozora Bunko 上杉謙信 corpus.
  download-kenshin:
    image: alpine:3.19
    command: >
      sh -c "apk --no-cache add wget unzip &&
             mkdir -p /data &&
             wget -q -O /tmp/kenshin.zip
               'https://www.aozora.gr.jp/cards/001562/files/56461_ruby_53134.zip' &&
             unzip -q /tmp/kenshin.zip -d /tmp/kenshin_extract &&
             SJIS=$(find /tmp/kenshin_extract -name '*.txt' | head -1) &&
             iconv -f CP932 -t UTF-8 \"\$SJIS\" > /data/kenshin.txt &&
             rm -rf /tmp/kenshin.zip /tmp/kenshin_extract &&
             echo 'Downloaded and converted kenshin.txt'"
    volumes:
      - ./data:/data

  # Convenience service that downloads the E. coli K-12 MG1655 genome from NCBI
  # and converts the FASTA to a plain-text DNA sequence for FM-index testing.
  download-ecoli:
    image: alpine:3.19
    command: >
      sh -c "apk --no-cache add wget gzip &&
             mkdir -p /data &&
             wget -q -O /tmp/ecoli.fna.gz
               'https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/005/845/GCF_000005845.2_ASM584v2/GCF_000005845.2_ASM584v2_genomic.fna.gz' &&
             gunzip -c /tmp/ecoli.fna.gz > /data/ecoli.fna &&
             rm -f /tmp/ecoli.fna.gz &&
             awk '/^>/{if(seq!=\"\"){print toupper(seq);seq=\"\"};next}{seq=seq $0}END{if(seq!=\"\")print toupper(seq)}' /data/ecoli.fna > /data/ecoli.txt &&
             echo 'Downloaded and prepared ecoli.txt'"
    volumes:
      - ./data:/data
